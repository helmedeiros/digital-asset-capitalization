version: "2"

linters:
  enable:
    - revive
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unconvert
    - goconst
    - misspell
    - unparam
    - prealloc
  settings:
    revive:
      confidence: 0.8
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.Response.Body).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.Setenv
    staticcheck:
      checks:
        - "all"
        - "-ST*"
        - "-QF*"
  exclusions:
    paths:
      - testutil
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/helmedeiros/digital-asset-capitalization

run:
  tests: true
