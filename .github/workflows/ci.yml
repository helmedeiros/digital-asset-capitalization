name: CI

# Workflow to run tests and update coverage badge
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Minimal required permissions
permissions:
  contents: read
  statuses: write
  checks: write
  pull-requests: write
  actions: read

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          check-latest: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage and race detector
        id: test
        # -race catches data races on every PR; multiple were already
        # found and fixed in recent work (#70, #71, #72, #73) that CI
        # was missing because tests were not race-instrumented.
        # The badge is computed from a filtered profile that drops
        # testutil packages (test helpers that look like production
        # code to `go test -cover`) -- matching what
        # scripts/coverage-gate.sh enforces locally, so the badge and
        # the gate never disagree.
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          grep -v "testutil" coverage.out > coverage.filtered.out
          go tool cover -func=coverage.filtered.out | tee coverage.txt
          COVERAGE=$(go tool cover -func=coverage.filtered.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.10.1

      - name: Run linter
        run: golangci-lint run

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.4.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f811420c5b31e6c4d54855df77a88527
          filename: go-coverage.json
          label: coverage
          message: "${{ steps.test.outputs.coverage }}%"
          color: "${{ steps.test.outputs.coverage > 90 && 'success' || steps.test.outputs.coverage > 80 && 'yellow' || 'critical' }}"
          isError: false
          namedLogo: go
