name: Release

on:
  push:
    tags:
      - "v*"

# Only run releases from main branch
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release is from main branch
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -Eq '^[[:space:]]*origin/main$'; then
            echo "❌ Release tags must be created from main branch"
            echo "Current commit $GITHUB_SHA is not on main branch"
            exit 1
          fi
          echo "✅ Release tag created from main branch"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          check-latest: true

      - name: Run tests
        run: go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
