name: Release

on:
  push:
    tags:
      - "v*"

# Only run releases from main branch
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release is from main branch
        run: |
          # Check if the current commit is on main branch
          git branch --contains ${{ github.sha }} | grep -q "main" || git branch -r --contains ${{ github.sha }} | grep -q "origin/main"
          if [ $? -ne 0 ]; then
            echo "❌ Release tags must be created from main branch"
            echo "Current commit ${{ github.sha }} is not on main branch"
            exit 1
          fi
          echo "✅ Release tag created from main branch"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          check-latest: true

      - name: Run tests
        run: go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
